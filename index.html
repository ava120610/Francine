<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>門市優質服務</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #0a0a0a;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Background stripes */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 40px,
      rgba(0,114,51,0.04) 40px,
      rgba(0,114,51,0.04) 80px
    );
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Top accent bar */
  .accent-bar {
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, #e8001c, #007233, #f5a623);
    border-radius: 6px 6px 0 0;
  }

  /* Header card */
  .header-card {
    width: 100%;
    background: #111;
    border: 1px solid #222;
    border-top: none;
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }

  .logo-badge {
    background: #007233;
    color: #f5a623;
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 6px;
    letter-spacing: 2px;
  }

  .header-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    color: white;
  }

  .header-sub {
    font-size: 12px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Cards */
  .cards {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 3px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 24px;
    background: #111;
    border: 1px solid #1e1e1e;
    text-decoration: none;
    color: white;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .card:hover {
    background: #161616;
    border-color: #333;
    transform: translateX(4px);
  }

  .card:hover::before {
    transform: scaleY(1);
  }

  .card:active {
    transform: translateX(2px) scale(0.99);
  }

  .card-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    opacity: 0.9;
  }

  .card-text { flex: 1; }
  .card-label {
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.3;
  }
  .card-desc {
    font-size: 11px;
    color: #555;
    margin-top: 3px;
  }

  .card-arrow {
    color: #333;
    font-size: 18px;
    transition: color 0.2s, transform 0.2s;
  }
  .card:hover .card-arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  /* Bottom bar */
  .bottom-bar {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #1a1a1a;
    border-top: none;
    padding: 14px 24px;
    text-align: center;
    font-size: 11px;
    color: #333;
    letter-spacing: 1px;
    border-radius: 0 0 8px 8px;
  }

  /* Entrance animation */
  .wrap > * {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s ease forwards;
  }
  .accent-bar { animation-delay: 0s; }
  .header-card { animation-delay: 0.1s; }
  .cards { animation-delay: 0.2s; }
  .bottom-bar { animation-delay: 0.3s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card stagger */
  .card:nth-child(1) { animation: fadeUp 0.4s 0.25s ease both; }
  .card:nth-child(2) { animation: fadeUp 0.4s 0.35s ease both; }
  .cards { opacity: 1; transform: none; animation: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="accent-bar"></div>

  <div class="header-card">
    <div class="logo-row">
      
    </div>
    <div class="header-title">門市優質服務</div>
    <div class="header-sub">Service Quality System · 2026</div>
  </div>

  <div class="cards">

    <a class="card" href="https://forms.gle/gBpTBprpnpZkzuqg7" target="_blank" style="--accent:#007233">
      <div class="card-icon">📝</div>
      <div class="card-text">
        <div class="card-label">Self Evaluation</div>
        <div class="card-title">優質服務自評</div>
        <div class="card-desc">Google 表單填寫</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a class="card" href="https://ava120610.github.io/Francine/servicequalityevaluationform2026.html" style="--accent:#e8001c">
      <div class="card-icon">✅</div>
      <div class="card-text">
        <div class="card-label">Evaluation Form</div>
        <div class="card-title">優質服務評分表</div>
        <div class="card-desc">門市查核 · 即時計分</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

  </div>

  <div class="bottom-bar">門市服務管理系統</div>
</div>

</body>
</html>
